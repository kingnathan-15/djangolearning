<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Password Manager{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #2d3748;
            font-size: 2.5em;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        h2 {
            color: #4a5568;
            font-size: 1.8em;
            margin: 30px 0 20px;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 0.9em;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        thead tr {
            background-color: #667eea;
            color: white;
            text-align: left;
            font-weight: bold;
        }

        th, td {
            padding: 12px 15px;
        }

        tbody tr {
            border-bottom: 1px solid #dddddd;
        }

        tbody tr:nth-of-type(even) {
            background-color: #f3f6ff;
        }

        tbody tr:last-of-type {
            border-bottom: 2px solid #667eea;
        }

        tbody tr:hover {
            background-color: #e6ecff;
            transition: background-color 0.3s ease;
        }

        /* List Styles */
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #f8f9fa;
            margin: 10px 0;
            padding: 15px 20px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        li:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        a {
            text-decoration: none;
            color: #2d3748;
            font-weight: 500;
            display: block;
        }

        a:hover {
            color: #667eea;
        }

        /* Form Styles */
        form {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin: 20px 0;
        }

        form p {
            margin-bottom: 15px;
        }

        form label {
            display: block;
            margin-bottom: 5px;
            color: #4a5568;
            font-weight: 500;
        }

        form input[type="text"],
        form input[type="password"],
        form input[type="email"],
        form select,
        form textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        form input[type="text"]:focus,
        form input[type="password"]:focus,
        form input[type="email"]:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background-color: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #5a67d8;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Empty State Styles */
        .empty-message {
            text-align: center;
            padding: 40px;
            background-color: #f8f9fa;
            border-radius: 8px;
            color: #718096;
            font-style: italic;
            margin: 20px 0;
        }

        td[colspan="100%"] {
            text-align: center;
            padding: 30px;
            color: #718096;
            font-style: italic;
        }

        /* Navigation Links */
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            font-weight: 600;
            padding: 10px 20px;
            background-color: #f3f6ff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background-color: #667eea;
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            h2 {
                font-size: 1.5em;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            button {
                width: 100%;
            }
        }

        /* Flash Messages */
        .messages {
            list-style: none;
            margin-bottom: 20px;
        }

        .messages li {
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .messages .success {
            background-color: #c6f6d5;
            border-left-color: #48bb78;
            color: #22543d;
        }

        .messages .error {
            background-color: #fed7d7;
            border-left-color: #f56565;
            color: #742a2a;
        }

        .messages .info {
            background-color: #bee3f8;
            border-left-color: #4299e1;
            color: #2c5282;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <h1>{% block page_title %}Password Manager{% endblock %}</h1>
        
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
